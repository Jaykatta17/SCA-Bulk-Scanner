# SCA Scanner Configuration
# All settings for the bulk vulnerability scanner

# Docker images
docker:
  grype_image: "anchore/grype:latest"
  syft_image: "anchore/syft:latest"

# Parallelism settings
parallelism:
  max_parallel: 6

# Cloning settings
cloning:
  retries: 3
  backoff_seconds: 1

# Database settings
database:
  path: "data/sca_scanner.db"

# Directory paths (relative to project root)
paths:
  reports_dir: "reports"
  cloned_projects_dir: "cloned_projects"
  csv_file: "data/target_projects.csv"
  html_template: "templates/html.tmpl"
